spring:
  messages:
    basename: messages_tr
    encoding: UTF-8
    always-use-message-format: true
  application:
    name: core
  flyway:
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  ai:
    connect-timeout: 2s
    read-timeout: 5s

server:
  port: 8081
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: true
        same-site: lax
