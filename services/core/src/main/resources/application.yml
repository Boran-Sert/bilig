spring:
  application:
    name: core
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    out-of-order: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: 8081
