# Claude görevlerinin ayarları (plan Bölüm 10). Her görev: model, prompts/tde altındaki prompt
# dosyası, en fazla çıktı token'ı ve saniye cinsinden zaman aşımı. Görev adı app/llm/tasks.py'deki
# LlmTask'ta da bulunur; modelin fiyatı llm_pricing.yaml'da olmalıdır.
DOC_CLASSIFY:
  model: claude-haiku-5-5
  prompt: doc_classify.j2
  max_tokens: 16000
  timeout_seconds: 120
