# Claude modellerinin fiyatları, milyon token başına dolar. Kaynak (2026-10-29'da kontrol edildi):
# https://platform.claude.com/docs/en/about-claude/pricing. Fiyat değişince sadece bu dosya
# güncellenir. cache_write 5 dakikalık önbelleğe yazma fiyatıdır. Kademe, istemin bütün giriş
# token'larıyla (önbellekten okunan ve yazılan dahil) seçilir; up_to_prompt_tokens'ı olmayan kademe
# sınırsızdır. llm_tasks.yaml'daki her modelin burada fiyatı olmalıdır.
claude-haiku-5-5:
  - up_to_prompt_tokens: 100000
    input: 0.10
    cache_write: 0.125
    cache_read: 0.01
    output: 0.50
  - input: 0.50
    cache_write: 0.625
    cache_read: 0.05
    output: 2.50
claude-sonnet-5-5:
  - input: 2
    cache_write: 2.50
    cache_read: 0.10
    output: 10
