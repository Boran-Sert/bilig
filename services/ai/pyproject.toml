[project]
name = "ai"
version = "0.1.0"
description = "Hata Analizi Asistanı yapay zeka servisi"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=2.2.0",
    "fastapi>=0.149.0",
    "jinja2>=3.1.6",
    "numpy>=2.5",
    "pgvector>=0.5.1",
    "pillow>=12.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pymupdf>=2.0",
    "pypdfium2>=5.14",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.2.0",
    "structlog>=26.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
# Tipsiz PyMuPDF çağrıları
untyped_calls_exclude = ["pymupdf"]

# pypdfium2 tip bilgisi yayımlamıyor
[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu132", marker = "sys_platform == 'win32'" }

# Windows için CUDA
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
