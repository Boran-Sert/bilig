# Java servisi: biçim (Spotless), Javadoc (Checkstyle) ve testler.
# Her PR'da raporlanır; services/core ya da bu dosya değişmediyse iş atlanır.
name: core

on:
  pull_request:
  push:
    branches: [master]
    paths: ["services/core/**", "infra/postgres/Dockerfile", ".github/workflows/core.yml"]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || ! git diff --quiet "origin/$GITHUB_BASE_REF...HEAD" -- services/core infra/postgres/Dockerfile .github/workflows/core.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: ./mvnw -B verify
