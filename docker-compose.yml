# Bütün servisler tek komutla: docker compose up --build
# Değerler .env dosyasından gelir; ilk kurulumda .env.example kopyalanır.
services:
  web:
    build: apps/web
    ports:
      - "8080:80"
    depends_on:
      - core

  core:
    build: services/core
    env_file: .env
    ports:
      - "8081:8081"
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy

  ai-api:
    build: services/ai
    env_file: .env
    expose:
      - "8000"
    volumes:
      - data:/data
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy

  ai-worker:
    build: services/ai
    command: ["python", "-m", "app.worker"]
    init: true
    env_file: .env
    volumes:
      - data:/data
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build: infra/postgres
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  data:
  models:
